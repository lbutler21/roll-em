<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile – 5e D&D Character Sheet</title>
  <script>
    (function(){try{var t=localStorage.getItem('dice-proj-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();
    (function(){try{var s=localStorage.getItem('dice-proj-scene');if(s)document.documentElement.setAttribute('data-scene',s);}catch(e){}})();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app profile-page">
    <header class="profile-header">
      <div class="profile-header-inner">
        <a href="index.html" class="profile-logo">5e D&D Character Sheet</a>
        <div class="profile-header-right">
          <button type="button" id="profile-theme-toggle" class="btn btn-ghost no-print" title="Toggle light/dark mode" aria-label="Theme">☀</button>
          <span id="profile-username" class="profile-username"></span>
          <a href="index.html" class="btn btn-ghost">Character sheet</a>
          <button type="button" id="profile-logout" class="btn btn-ghost">Log out</button>
        </div>
      </div>
    </header>

    <main class="profile-main">
      <section class="profile-section profile-info-card">
        <h1 class="profile-section-title">Profile</h1>
        <div id="profile-data" class="profile-data">
          <p class="profile-field"><span class="profile-field-label">Username</span> <span id="profile-username-value"></span></p>
          <p class="profile-field"><span class="profile-field-label">Member since</span> <span id="profile-created-value"></span></p>
        </div>
      </section>

      <section class="profile-section">
        <h2 class="profile-section-title">My Characters</h2>
        <div id="profile-characters-grid" class="profile-characters-grid">
          <!-- Filled by JS -->
        </div>
        <p id="profile-characters-empty" class="profile-characters-empty hidden">You have no saved characters. <a href="index.html">Create one</a> on the character sheet.</p>
      </section>
    </main>
  </div>

  <script src="profile.js"></script>
</body>
</html>
